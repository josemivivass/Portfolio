name: Build y despliegue

# GitHub compila las dos imagenes (aqui, en sus maquinas, con 4 nucleos y 16 GB)
# y las sube a su registro privado. Luego el runner self-hosted que vive en la
# VM solo se las descarga y levanta los contenedores: segundos y sin gastar
# memoria del servidor de casa.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  IMAGEN_API: ghcr.io/${{ github.repository_owner }}/portfolio-api
  IMAGEN_WEB: ghcr.io/${{ github.repository_owner }}/portfolio-web

jobs:
  imagenes:
    name: Compilar y publicar imagenes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN_API }}:latest
            ${{ env.IMAGEN_API }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Imagen de la web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN_WEB }}:latest
            ${{ env.IMAGEN_WEB }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  desplegar:
    name: Desplegar en la VM
    needs: imagenes
    # La etiqueta "vm" distingue el runner de la VM del que aun vive en el LXC:
    # asi el despliegue nunca cae en la maquina equivocada.
    runs-on: [self-hosted, vm]
    permissions:
      contents: read
      packages: read
    env:
      DIR: /opt/homelab/portfolio
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Entrar en el registro
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Descargar las imagenes nuevas y levantar
        run: |
          set -euo pipefail
          cd "$DIR"
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Comprobar que responde
        run: |
          set -uo pipefail
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null \
               && curl -fsS -o /dev/null http://127.0.0.1:4000/; then
              echo "API y web respondiendo"
              exit 0
            fi
            sleep 5
          done
          echo "Algo no levanta. Ultimas lineas de los contenedores:"
          cd "$DIR" && docker compose logs --tail 60
          exit 1
